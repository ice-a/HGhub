name: Release

# 自动出三平台包（Windows 安装包 / macOS dmg / Android APK）：
#   - push 到 main：自动构建三平台并上传 artifacts，不发布 Release
#   - 打 tag v*：自动构建三平台 + 发布 GitHub Release
#   - Actions 页 / gh workflow run：手动跑一次，只出 artifacts
# 注意：macOS runner 的分钟数按 10 倍计费，push main 每次会触发一次三平台构建，
# 若想只在发版时构建，删掉下面 branches: [main] 即可（tag 与手动触发仍可用）。
# .github/** 与文档改动被 paths-ignore 排除，避免改 workflow 自身触发递归构建。
# 注：tag push 不参与路径过滤，任何 v* tag 都会触发。
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # ================= Windows：NSIS 安装包 + 便携包 =================
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis

      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  # ================= Android：按 ABI 分包 + 签名 =================
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci --skip-targets-install

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --ci --apk --split-per-abi --target aarch64 armv7 x86_64

      # 签名 keystore 是可选 secret：
      #   配置了 ANDROID_KEY_* → 用正式 keystore 签（可上架 / 覆盖安装）
      #   没配置 → 现场生成 CI 临时 keystore 签，APK 依然可直接安装，构建不会因此失败
      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "使用仓库配置的正式签名"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            KS_ALIAS="$KEY_ALIAS"
            KS_PASS="$STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASSWORD}"
            SUFFIX=""
          else
            echo "::warning::未配置 ANDROID_KEY_* secrets，改用 CI 临时 keystore 签名（仅供测试分发，不可用于上架）"
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HGhub CI, OU=CI, O=HGhub, L=NA, ST=NA, C=US" > /dev/null 2>&1
            KS_ALIAS="androiddebugkey"
            KS_PASS="android"
            KEY_PASS="android"
            SUFFIX="_ci-debug"
          fi
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhub_${VERSION}_${abi}${SUFFIX}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify "$out"
            echo "signed: $out"
            found=$((found+1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | sort)
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  # ================= macOS：通用二进制 .app + .dmg =================
  macos:
    name: macOS (app + dmg, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # universal 需要两个 arch 的 std；Xcode Command Line Tools / hdiutil 由 runner 自带
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - run: pnpm install --frozen-lockfile

      # 无 Apple Developer 证书时用 ad-hoc 签名；bundle 目标来自 tauri.macos.conf.json（app + dmg）
      - name: 构建 app + dmg（Intel + Apple Silicon 通用包）
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --ci --target universal-apple-darwin

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          B="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p artifacts
          for f in "$B"/dmg/*.dmg; do cp "$f" artifacts/; done
          for a in "$B"/macos/*.app; do
            ditto -c -k --sequesterRsrc --keepParent "$a" "artifacts/HGhub_${V}_universal.app.zip"
          done
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  # ================= 发布 =================
  release:
    name: Publish GitHub Release
    needs: [windows, android, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true